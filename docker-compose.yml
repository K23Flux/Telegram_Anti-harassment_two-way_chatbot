services:
  TG-Antiharassment-Bot:
    container_name: TG-Antiharassment-Bot
    image: ghcr.io/k23flux/tg-antiharassment-bot:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
